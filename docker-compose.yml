services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
      # - "8642:8642"  # gateway port, if you want
    volumes:
      - ./data:/opt/data
    env_file:
      - .env
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
    networks:
      - hermes-agent
      # - 1panel-network

  web:
    image: ghcr.io/lgc2333/hermes-agent-desktop-web:latest
    container_name: hermes-agent-desktop-web
    restart: unless-stopped
    depends_on:
      - hermes
    ports:
      - "${WEB_PORT:-6722}:6722"
    environment:
      - WEB_DEFAULT_GATEWAY_URL=${WEB_DEFAULT_GATEWAY_URL:-http://hermes:9119}
      - WEB_PROXY_ALLOWED_TARGETS=${WEB_PROXY_ALLOWED_TARGETS:-http://hermes:9119}
      - WEB_OAUTH_REDIRECT_URI=${WEB_OAUTH_REDIRECT_URI:-}
    networks:
      - hermes-agent
      # - 1panel-network

networks:
  hermes-agent:
    driver: bridge
  # 1panel-network:
  #   external: true
