packages:
  - apps/*
  - vendor/hermes-desktop
  - vendor/hermes-shared

# hermes (vendor/hermes-desktop) declares "@hermes/shared": "file:../shared",
# which resolves to vendor/shared in our layout — pin it to the vendored
# shared workspace package.
overrides:
  "@hermes/shared": workspace:*

# Flat node_modules (like the upstream npm monorepo) so the vendored renderer
# (vendor/hermes-desktop/src) resolves deps from the repo root.
nodeLinker: hoisted

# The web app never runs Electron / node-pty / electron-builder / esbuild
# (vite 8 uses rolldown), so their postinstall scripts are denied — no binary
# downloads, no native compiles. unicode-animations has a trivial script that
# vite dev may rely on.
allowBuilds:
  unicode-animations: true
  electron: false
  electron-winstaller: false
  get-windows: false
  node-pty: false
  esbuild: false
